[project]
name = "nebula-diffusion"
version = "0.1.0"
description = "Masked diffusion language model prototype (LLaDA-style)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "triton>=2.2.0",
    "transformers>=4.37.0",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "einops>=0.7.0",
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
