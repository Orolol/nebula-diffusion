# RTX 5090 optimized configuration (~200M params)
# Hybrid architecture: 75% Gated DeltaNet + 25% MLA, Expert Choice MoE, Block Diffusion

model:
  vocab_size: 50432  # GPT-2 padded to multiple of 128 for tensor cores (128 * 394)
  hidden_dim: 768
  num_layers: 12
  num_heads: 12
  head_dim: 64
  mlp_ratio: 4.0
  dropout: 0.1
  max_seq_len: 2048
  mask_token_id: 50257  # [MASK] = GPT-2's last token index

  # Hybrid attention: 75% DeltaNet, 25% MLA
  # For 12 layers: DeltaNet on 0,1,2,4,5,7,8,10,11 | MLA on 3,6,9
  deltanet_ratio: 0.75
  kv_latent_dim: 128  # MLA low-rank KV compression

  # MoE: Expert Choice with nested experts
  use_moe: true
  num_experts: 16
  num_expert_slices: 4
  moe_capacity_factor: 1.25
  moe_every_n_layers: 1  # MoE on all layers except first

  # Block diffusion
  block_size: 16

  # MTP (Multi-Token Prediction)
  use_mtp: true
  mtp_num_tokens: 4
  mtp_loss_weight: 0.1

training:
  # Larger batch for better GPU utilization on 5090 (32GB)
  # Effective batch = 16 * 4 = 64 samples
  batch_size: 16  
  gradient_accumulation_steps: 4
  learning_rate: 0.02  # Muon uses higher LR
  weight_decay: 0.0  # Muon doesn't need weight decay
  warmup_steps: 500
  max_steps: 100000
  mixed_precision: "bf16"
  gradient_checkpointing: false  # Disable for speed since we have VRAM headroom
  grad_clip: 1.0

  # Optimizer
  optimizer: "muon"  # "muon" or "adamw"

  # torch.compile (PyTorch 2.0+)
  compile: true
  compile_mode: "reduce-overhead"  # Better for training loops

  log_every: 10
  save_every: 5000
  eval_every: 1000
  wandb_project: "nebula-diffusion"
  wandb_run_name: "5090-hybrid"
  output_dir: "outputs/5090"
  checkpoint_dir: "checkpoints/5090"

diffusion:
  num_diffusion_steps: 128
  min_masking_ratio: 0.0
  max_masking_ratio: 1.0

  # DUS (Dilated Unmasking Scheduler) for generation
  dus_num_groups: 3
  dus_confidence_threshold: 0.5
  dus_use_kl: true
  dus_kl_threshold: 0.1

data:
  dataset_name: "HuggingFaceFW/fineweb-edu"
  dataset_config: "sample-100BT"
  max_seq_len: 2048
  num_workers: 0
  prefetch_factor: 16

seed: 42
device: "auto"
