# Base configuration (~200M params)
# Hybrid architecture: 75% Gated DeltaNet + 25% MLA, Expert Choice MoE, Block Diffusion

model:
  vocab_size: 50258  # GPT-2 + [MASK]
  hidden_dim: 768
  num_layers: 12
  num_heads: 12
  head_dim: 64
  mlp_ratio: 4.0
  dropout: 0.1
  max_seq_len: 1024
  mask_token_id: 50257

  # Hybrid attention: 75% DeltaNet, 25% MLA
  # For 12 layers: DeltaNet on 0,1,2,4,5,7,8,10,11 | MLA on 3,6,9
  deltanet_ratio: 0.75
  kv_latent_dim: 128  # MLA low-rank KV compression

  # MoE: Expert Choice with nested experts
  use_moe: true
  num_experts: 16
  num_expert_slices: 4
  moe_capacity_factor: 1.25
  moe_every_n_layers: 2  # MoE on layers 1, 3, 5, 7, 9, 11

  # Block diffusion
  block_size: 8

  # MTP (Multi-Token Prediction)
  use_mtp: true
  mtp_num_tokens: 4
  mtp_loss_weight: 0.1

training:
  batch_size: 24
  gradient_accumulation_steps: 4
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 100000
  mixed_precision: "bf16"
  gradient_checkpointing: true
  grad_clip: 1.0

  # torch.compile (PyTorch 2.0+)
  compile: true
  compile_mode: "default"  # "default", "reduce-overhead", "max-autotune"

  log_every: 10
  save_every: 5000
  eval_every: 1000
  wandb_project: "nebula-diffusion"
  wandb_run_name: "base-hybrid"
  output_dir: "outputs/base"
  checkpoint_dir: "checkpoints/base"

diffusion:
  num_diffusion_steps: 128
  min_masking_ratio: 0.0
  max_masking_ratio: 1.0

  # DUS (Dilated Unmasking Scheduler) for generation
  dus_num_groups: 3
  dus_confidence_threshold: 0.5
  dus_use_kl: true
  dus_kl_threshold: 0.1

data:
  dataset_name: "HuggingFaceFW/fineweb-edu"
  dataset_config: "sample-100BT"
  max_seq_len: 1024
  num_workers: 0
  prefetch_factor: 2

seed: 42
device: "auto"
