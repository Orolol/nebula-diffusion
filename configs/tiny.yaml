# Tiny configuration for initial testing (~5M params)
# Hybrid architecture: 75% Gated DeltaNet + 25% MLA, Expert Choice MoE, Block Diffusion

model:
  vocab_size: 50258  # GPT-2 + [MASK]
  hidden_dim: 128
  num_layers: 4
  num_heads: 2
  head_dim: 64
  mlp_ratio: 4.0
  dropout: 0.1
  max_seq_len: 128
  mask_token_id: 50257

  # Hybrid attention: 75% DeltaNet, 25% MLA
  # For 4 layers: [deltanet, deltanet, deltanet, mla]
  deltanet_ratio: 0.75
  kv_latent_dim: 32  # MLA low-rank KV compression

  # MoE: Expert Choice with nested experts
  use_moe: true
  num_experts: 4
  num_expert_slices: 4
  moe_capacity_factor: 1.25
  moe_every_n_layers: 2  # MoE on layers 1, 3

  # Block diffusion
  block_size: 8

  # MTP (Multi-Token Prediction)
  use_mtp: true
  mtp_num_tokens: 2
  mtp_loss_weight: 0.1

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1e-3
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 1000
  mixed_precision: "bf16"
  gradient_checkpointing: false
  grad_clip: 1.0
  log_every: 10
  save_every: 500
  eval_every: 250
  wandb_project: "nebula-diffusion"
  wandb_run_name: "tiny-hybrid"
  output_dir: "outputs/tiny"
  checkpoint_dir: "checkpoints/tiny"

diffusion:
  num_diffusion_steps: 32
  min_masking_ratio: 0.0
  max_masking_ratio: 1.0

  # DUS (Dilated Unmasking Scheduler) for generation
  dus_num_groups: 3
  dus_confidence_threshold: 0.5
  dus_use_kl: true
  dus_kl_threshold: 0.1

data:
  dataset_name: "HuggingFaceFW/fineweb-edu"
  dataset_config: "sample-10BT"
  max_seq_len: 128
  num_workers: 0
  prefetch_factor: 2

seed: 42
device: "auto"
